spring.application.name=disaster-relief-backend

# --- IPFS (decentralized off-chain data store, replaces PostgreSQL) ---
# Kubo RPC API - used for add/cat/pin and MFS operations
app.ipfs.api-url=${IPFS_API_URL:http://127.0.0.1:5001/api/v0}
# Public gateway - used to resolve CID to HTTP content
app.ipfs.gateway-url=${IPFS_GATEWAY_URL:http://127.0.0.1:8080}
# MFS root path for this application's documents
app.ipfs.mfs-root=${IPFS_MFS_ROOT:/disaster-relief}
# Root index document name (discovery of all collections)
app.ipfs.index-name=${IPFS_INDEX_NAME:index.json}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:disaster_relief_jwt_secret_key_must_be_at_least_32_chars_long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- ML Service ---
app.ml.service.url=${ML_SERVICE_URL:http://localhost:8000/predict}

# --- Ethereum (blockchain workflow verification) ---
app.ethereum.rpc-url=${ETH_RPC_URL:http://127.0.0.1:8545}
app.ethereum.chain-id=${ETH_CHAIN_ID:31337}
app.ethereum.contract-address=${ETH_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}

# --- Server ---
server.port=8081
